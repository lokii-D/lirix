version: 2
updates:
  # 自动化管理 GitHub Actions 供应链更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # 自动化管理 pip 依赖更新 (针对 requirements/pyproject)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
