# --- Optional lane header (see docs/ci_gate_matrix.md) ---
# Quality dimension: perf / slow / e2e / network markers (pytest marker suite).
# Blocks mainline PR merges: no (scheduled + manual dispatch).
# Matrix anchor: docs/ci_gate_matrix.md → workflow "slow-lane-schedule.yml".
# ---
name: Slow Lane Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  slow_lane:
    name: Slow/E2E/Network/Perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
      - name: Run slow marker suite
        run: |
          python -m pytest -q -m "slow or e2e or network or perf"
