# --- Optional lane header (see docs/ci_gate_matrix.md) ---
# Quality dimension: STO / supply-chain artifact (CycloneDX SBOM).
# Blocks mainline PR merges: no.
# Matrix anchor: docs/ci_gate_matrix.md → workflow "sbom-optional.yml".
# ---
# Non-required: CycloneDX SBOM artifact for procurement (does not block PR merges).
name: Optional SBOM (CycloneDX)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
      - name: Install package and SBOM tool
        run: |
          python -m pip install cyclonedx-bom
      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o lirix-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: lirix-cyclonedx-sbom
          path: lirix-sbom.json
