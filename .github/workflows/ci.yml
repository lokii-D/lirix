name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_required:
    name: Fast Required
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
          with-dev-install: "false"
      - name: Hygiene gate (repo cleanliness + sign-off allowlist)
        run: python tools/harness.py hygiene
      - name: Repo exclusions alignment gate
        run: python tools/harness.py check-exclusions
      - name: Import topology drift gate
        run: python tools/gen_lirix_import_graph.py --check
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Black check
        run: python -m black --check .
      - name: Run MyPy
        run: python -m mypy --strict lirix
      - name: Governance gate (explicit)
        run: |
          python -m pytest -q \
            tests/test_core/test_canonical_semantics.py \
            tests/test_core/test_agent_feedback_reason_taxonomy_closure.py \
            tests/test_core/test_session.py \
            tests/test_core/test_session_replay_verifier_malformed_shapes.py \
            tests/test_core/test_session_workflow_strict_happy_path.py \
            tests/test_core/test_replay_registry_closure_binding.py \
            tests/test_core/test_replay_registry_closure_parity_all_entrypoints.py \
            tests/test_core/test_chain_adapter_profiles.py \
            tests/test_core/test_hook_manager.py \
            tests/test_core/test_hook_governance_async_contract_mode_parity.py \
            tests/test_core/test_status_aggregation.py \
            tests/test_core/test_config_governance_overlap_guards.py \
            tests/test_core/test_simulate_only_prior_validate_config.py \
            tests/test_core/test_entrypoints.py \
            tests/test_core/test_entrypoint_symbol_binding_contract.py \
            tests/test_core/test_public_exports_contract.py \
            tests/test_core/test_cli_public_contract.py \
            tests/test_core/test_readme_envelope_contract.py \
            tests/test_core/test_governance_provenance_matrix.py \
            tests/test_layers/test_l4_rpc_manager_disagreement_report.py \
            tests/test_layers/test_shadow_auditor_policy_bundle.py \
            tests/test_integrations/test_langchain_tool_run_arun_delegate_to_guardian_paths.py
      - name: Registry authority contract gate
        run: python tools/harness.py registry-authority-contract
      - name: Release notes gate
        run: |
          rg -n "API Contract Delta" docs/release_notes.md
          rg -n "additive and backward compatible" docs/release_notes.md
      - name: Docs contract gate
        run: python tools/harness.py contract-manifest
      - name: Required checks policy gate
        run: python tools/harness.py required-check-policy
      - name: CI lane responsibility gate
        run: python tools/harness.py ci-lane-responsibility
      - name: Compat switch expiry gate
        run: python tools/harness.py compat-switch-expiry
      - name: Plan-to-PR exit metrics gate
        run: python tools/harness.py plan-to-pr-exit-metrics
      - name: Audit internal doc links
        run: python tools/harness.py audit-internal-link
      - name: Doc preamble hygiene gate (warn-only)
        run: python tools/harness.py doc-preamble-hygiene
      - name: No internal imports gate (anti-regression)
        run: python tools/harness.py no-internal-imports
      - name: Root import surface gate
        run: python tools/harness.py root-import-surface
      - name: Monkeypatch convention gate (strict)
        run: python tools/harness.py test-monkeypatch-convention --strict
      - name: Test topology admission gate
        run: python tools/harness.py test-topology-admission
        env:
          TEST_TOPOLOGY_MAX_COST_SECONDS: "320"
          TEST_TOPOLOGY_MAX_FAILURE_DENSITY: "0.02"
      - name: Migration observability report (truth source)
        run: python tools/migration_observability_report.py
  coverage_required:
    name: Coverage Required (Single Authority)
    if: github.event_name != 'pull_request'
    needs: fast_required
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
      - name: Run full suite with coverage fail-under=100
        run: |
          python -m pytest -q --cov=lirix --cov-report=term-missing:skip-covered --cov-report=xml

  pr_compat_smoke:
    name: PR Compatibility Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name == 'pull_request'
    needs: fast_required
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: ${{ matrix.python-version }}
          enable-pip-cache: "true"
      - name: Run PR compatibility smoke subset
        run: |
          python -m pytest -q tests/test_core/test_entrypoints.py tests/test_core/test_sync_async_contract_consistency.py tests/test_core/test_registry_authority_contract.py

  compatibility_matrix:
    name: Compatibility Matrix (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    needs: fast_required
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: ${{ matrix.python-version }}
          enable-pip-cache: "true"

      - name: Run compatibility test subset
        run: |
          python -m pytest -q -m "not slow and not e2e and not network and not perf and not migration"
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONLEGACYWINDOWSSTDIO: "0"
          PYTHONUTF8: "1"
