name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.tox-env }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.9"
            tox-env: py39
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314
    continue-on-error: ${{ matrix.python-version == '3.13' || matrix.python-version == '3.14' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Start Anvil and Verify
        shell: bash
        run: |
          # 1. Ensure anvil command exists
          command -v anvil >/dev/null 2>&1 || { echo "FATAL: anvil command not found"; exit 1; }

          # 2. Start anvil and redirect logs
          anvil --host 127.0.0.1 --port 8545 > anvil.log 2>&1 &
          ANVIL_PID=$!
          echo "Anvil PID: $ANVIL_PID"

          # 3. Fast health check with crash detection
          echo "Checking Anvil node health..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8545 > /dev/null; then
              echo "Anvil is ready!"
              exit 0
            fi

            if ! kill -0 $ANVIL_PID 2>/dev/null; then
              echo "Anvil process crashed. Dumping logs:"
              cat anvil.log
              exit 1
            fi

            echo "Waiting for Anvil response ($i/30)..."
            sleep 1
          done

          echo "Timeout after 30s: Anvil did not respond. Last logs:"
          cat anvil.log
          exit 1

      - name: Run tox
        run: tox -e ${{ matrix.tox-env }}
