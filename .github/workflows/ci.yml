name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.tox-env }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.8"
            tox-env: py38
          - python-version: "3.9"
            tox-env: py39
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314
    continue-on-error: ${{ matrix.python-version == '3.13' || matrix.python-version == '3.14' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Start Anvil
        shell: bash
        run: |
          anvil --silent --host 127.0.0.1 --port 8545 > anvil.log 2>&1 &

      - name: Wait for Anvil health
        run: |
          python - <<'PY'
          import time, urllib.request, sys
          url = "http://127.0.0.1:8545"
          deadline = time.time() + 90
          while time.time() < deadline:
              try:
                  urllib.request.urlopen(url, timeout=1)
                  print("Anvil is ready!")
                  sys.exit(0)
              except Exception:
                  time.sleep(0.5)
          raise SystemExit("Anvil did not become ready in time")
          PY

      - name: Run tox
        run: tox -e ${{ matrix.tox-env }}
