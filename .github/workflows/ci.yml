name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_required:
    name: Fast Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
          with-dev-install: "false"
      - name: Hygiene gate (repo cleanliness + sign-off allowlist)
        run: python tools/harness.py hygiene
      - name: Repo exclusions alignment gate
        run: python tools/harness.py check-exclusions
      - name: Preflight remediation status gate (topology + worktree SSOT)
        run: python tools/harness.py preflight-remediation-status
      - name: Install lint dependencies
        run: |
          python -m pip install --timeout 60 --upgrade pip
          python -m pip install --timeout 60 -e ".[dev]"
      - name: Run Ruff
        run: python tools/harness.py lint
      - name: Run Black check
        run: python tools/harness.py format-check
      - name: Run MyPy
        run: python tools/harness.py typecheck
      - name: Governance gate (explicit)
        run: python tools/harness.py test-governance
      - name: Registry authority contract gate
        run: python tools/harness.py registry-authority-contract
      - name: Release notes gate
        run: python tools/harness.py release-notes-gate
      - name: Docs contract gate
        run: python tools/harness.py contract-manifest
      - name: Required checks policy gate
        run: python tools/harness.py required-check-policy
      - name: CI lane responsibility gate
        run: python tools/harness.py ci-lane-responsibility
      - name: Compat switch expiry gate
        run: python tools/harness.py compat-switch-expiry
      - name: Plan-to-PR exit metrics gate
        run: python tools/harness.py plan-to-pr-exit-metrics
      - name: Audit internal doc links
        run: python tools/harness.py audit-internal-link
      - name: Doc preamble hygiene gate (warn-only)
        run: python tools/harness.py doc-preamble-hygiene
      - name: No internal imports gate (anti-regression)
        run: python tools/harness.py no-internal-imports
      - name: Root import surface gate
        run: python tools/harness.py root-import-surface
      - name: Monkeypatch convention gate (strict)
        run: python tools/harness.py test-monkeypatch-convention --strict
      - name: Test topology admission gate
        run: python tools/harness.py test-topology-admission
        env:
          TEST_TOPOLOGY_MAX_COST_SECONDS: "320"
          TEST_TOPOLOGY_MAX_FAILURE_DENSITY: "0.02"
      - name: Migration observability report (truth source)
        run: python tools/harness.py migration-observability-report
  coverage_required:
    name: Coverage Required (Single Authority)
    if: github.event_name != 'pull_request'
    needs: fast_required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
      - name: Run full suite with coverage fail-under=100
        run: python tools/harness.py test-coverage-required

  pr_compat_smoke:
    name: PR Compatibility Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name == 'pull_request'
    needs: fast_required
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: ${{ matrix.python-version }}
          enable-pip-cache: "true"
      - name: Run PR compatibility smoke subset
        run: python tools/harness.py test-pr-compat-smoke

  compatibility_matrix:
    name: Compatibility Matrix (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    needs: fast_required
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: ${{ matrix.python-version }}
          enable-pip-cache: "true"

      - name: Run compatibility test subset
        run: python tools/harness.py test-compat-matrix
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONLEGACYWINDOWSSTDIO: "0"
          PYTHONUTF8: "1"
