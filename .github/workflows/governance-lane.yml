name: Governance Lane

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance_gates:
    name: Governance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
          with-dev-install: "false"

      - name: Hygiene gate (repo cleanliness + sign-off allowlist)
        run: python tools/harness.py hygiene

      - name: Repo exclusions alignment gate
        run: python tools/harness.py check-exclusions

      - name: Import topology drift gate
        run: python tools/gen_lirix_import_graph.py --check

      - name: Install dev dependencies (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Doc preamble hygiene gate (warn-only)
        run: python tools/harness.py doc-preamble-hygiene

      - name: CV score report (non-enforcing; see docs/cv_rubric.yaml)
        run: python tools/cv_score_report.py

      - name: Branch protection drift gate
        run: python tools/harness.py branch-protection-drift

      - name: CI lane responsibility gate
        run: python tools/harness.py ci-lane-responsibility

      - name: Failure surface triage gate
        run: python tools/harness.py failure-surface-triage

      - name: Legacy sunset automation gate
        run: python tools/harness.py legacy-sunset

      - name: Phase exit checklist gate
        run: python tools/harness.py phase-exit-checklists

