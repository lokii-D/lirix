# --- Mantle branch lane (see docs/mantle_mainline_split.md) ---
# Quality dimension: Mantle harness (mantle_TT/ + fork smoke); does not replace mainline ci.yml.
# Blocks mainline PR merges: no (mantle-turing-* branches / manual dispatch only).
# ---
name: Mantle Harness CI

on:
  push:
    branches:
      - "mantle-turing-*"
      - "mantle/**"
  pull_request:
    branches:
      - "mantle-turing-*"
      - "mantle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantle-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mantle_harness_required:
    name: Mantle Harness Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
      - name: Verify mantle_TT tree present
        run: test -f mantle_TT/README.md
      - name: Mantle bundle + pytest (watchdog)
        run: bash mantle_TT/scripts/validate_harness.sh
      - name: Ruff (mantle_TT only)
        run: python -m ruff check mantle_TT --config mantle_TT/pyproject.toml
      - name: Black (mantle_TT only)
        run: python -m black --check --quiet --config mantle_TT/pyproject.toml mantle_TT

  mantle_fork_optional:
    name: Mantle fork smoke (optional secret)
    runs-on: ubuntu-latest
    needs: mantle_harness_required
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - uses: ./.github/actions/lirix-ci-setup
        with:
          python-version: "3.12"
          with-dev-install: "false"
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d  # v1
        with:
          version: "v1.6.0-rc1"
          cache: true
      - name: Install dev dependencies
        run: |
          python -m pip install --timeout 60 --upgrade pip
          python -m pip install --timeout 60 -e ".[dev]"
      - name: Run Mantle fork pytest
        env:
          MANTLE_MAINNET_RPC: ${{ secrets.MANTLE_MAINNET_RPC }}
        run: |
          # Default aligns with lirix MANTLE_MAINNET_RPC_URLS[0]; rpc.testnet.mantle.xyz returns 404/301.
          pick_fork_url() {
            if [ -n "${MANTLE_MAINNET_RPC:-}" ]; then
              echo "$MANTLE_MAINNET_RPC"
              return 0
            fi
            for candidate in \
              https://rpc.mantle.xyz \
              https://mantle.drpc.org \
              https://rpc.sepolia.mantle.xyz; do
              if curl -sf -m 15 -X POST -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                "$candidate" | grep -q '"result"'; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }
          FORK_URL="$(pick_fork_url)" || { echo "No reachable Mantle RPC for anvil fork"; exit 1; }
          echo "Using fork URL: $FORK_URL"
          anvil --fork-url "$FORK_URL" --host 127.0.0.1 --port 8546 > mantle-anvil.log 2>&1 &
          ANVIL_PID=$!
          for i in {1..30}; do
            if curl --max-time 60 -s http://127.0.0.1:8546 >/dev/null; then
              python scripts/pytest_guard.py --inactivity-seconds 120 --hard-timeout-seconds 600 -- \
                python -m pytest -o addopts= -q --tb=short mantle_TT/tests/mantle/
              kill $ANVIL_PID || true
              exit 0
            fi
            if ! kill -0 $ANVIL_PID 2>/dev/null; then
              cat mantle-anvil.log
              exit 1
            fi
            sleep 1
          done
          cat mantle-anvil.log
          exit 1
