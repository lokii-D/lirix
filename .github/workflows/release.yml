# Build sdist+wheel → PyPI (trusted publishing) → GitHub Release assets.
#
# Triggers:
#   - push of tags v* (normal release path; does not run on main or PRs)
#   - workflow_dispatch: re-run full pipeline for an *existing* tag (e.g. v2.0.0)
#     after fixing PyPI / attaching assets without moving the tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.0.0). Must match pyproject version."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --timeout 60 --upgrade pip
          python -m pip install --timeout 60 build twine

      - name: Build distributions
        run: |
          rm -rf dist build
          python -m build --sdist --wheel

      - name: Twine check
        run: twine check --strict dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: py${{ 'pi' }}
      url: https://pypi.org/project/lirix/
    permissions:
      contents: write
      id-token: write
      actions: read

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          skip-existing: true

      # v2: if a GitHub Release already exists for this tag (e.g. created from the
      # web UI first), assets are merged/updated instead of failing like v1 often did.
      - name: Create or update GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lirix ${{ env.RELEASE_TAG }}
          files: dist/**
          generate_release_notes: true
