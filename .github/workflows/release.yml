# Build sdist+wheel → PyPI (trusted publishing) → GitHub Release assets.
#
# Triggers:
#   - push of tags v* (normal release path; does not run on main or PRs)
#   - workflow_dispatch: re-run full pipeline for an *existing* tag (e.g. v2.0.0)
#     after fixing PyPI / attaching assets without moving the tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.0.0). Must match pyproject version."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          rm -rf dist build
          python -m build --sdist --wheel

      - name: Twine check
        run: twine check --strict dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # v2: if a GitHub Release already exists for this tag (e.g. created from the
      # web UI first), assets are merged/updated instead of failing like v1 often did.
      - name: Create or update GitHub Release assets
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lirix ${{ env.RELEASE_TAG }}
          files: dist/**
          generate_release_notes: true
