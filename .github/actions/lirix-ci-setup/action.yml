# Composite: shared checkout + Python + editable dev install (see docs/ci_gate_matrix.md § Duplicate step audit).
name: Lirix CI setup
description: Checkout (optional), setup Python, and optionally install lirix editable with dev extras.

inputs:
  python-version:
    description: Python version passed to actions/setup-python
    required: true
  checkout-repository:
    description: When false, skip checkout (caller already checked out the repo).
    required: false
    default: "true"
  enable-pip-cache:
    description: When true, enable pip cache keyed on pyproject.toml.
    required: false
    default: "false"
  with-dev-install:
    description: When true, run pip install -e ".[dev]" after setup-python.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.checkout-repository == 'true'
      uses: actions/checkout@v4

    - name: Set up Python (pip cache)
      if: inputs.enable-pip-cache == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Set up Python (no pip cache)
      if: inputs.enable-pip-cache != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Lirix dev editable
      if: inputs.with-dev-install == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
