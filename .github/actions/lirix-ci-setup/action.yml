# Composite: shared checkout + Python + editable dev install (see docs/ci_gate_matrix.md § Duplicate step audit).
# Path-based composite actions (uses: ./.github/actions/...) require the repo on disk before GitHub can read
# this action.yml — callers must run actions/checkout first, then set checkout-repository: false (default).
name: Lirix CI setup
description: Optional inner checkout, setup Python, and optionally install lirix editable with dev extras.

inputs:
  python-version:
    description: Python version passed to actions/setup-python
    required: true
  checkout-repository:
    description: When true, run actions/checkout inside this composite (only safe after a prior checkout loaded this action, e.g. reusable workflow). For normal jobs, run actions/checkout first and keep this false.
    required: false
    default: "false"
  enable-pip-cache:
    description: When true, enable pip cache keyed on pyproject.toml.
    required: false
    default: "false"
  with-dev-install:
    description: When true, run pip install -e ".[dev]" after setup-python.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.checkout-repository == 'true'
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

    - name: Set up Python (pip cache)
      if: inputs.enable-pip-cache == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Set up Python (no pip cache)
      if: inputs.enable-pip-cache != 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Lirix dev editable
      if: inputs.with-dev-install == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
