[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lirix"
version = "2.0.3"
description = "Security-focused DeFi payload validation SDK (zero private keys in-library; explicit dependencies)."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "MIT"
authors = [{ name = "lokii", email = "zp715875634@gmail.com" }]
keywords = ["ethereum", "web3", "defi", "security", "multicall", "validation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "web3>=6.0.0,<8.0.0",
]

[project.scripts]
lirix = "lirix.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "ruff>=0.4.0,<1.0.0",
    "black==24.10.0",
    "mypy>=1.8.0,<2.0.0",
    "tox>=4.0.0,<5.0.0",
    "build>=1.0.0,<2.0.0",
    "twine>=6.0.0,<7.0.0",
]
# LangChain integration (`lirix.integrations.langchain`); users: `pip install lirix[langchain]`
langchain = [
    "langchain>=0.1.0,<1.0.0",
    "langchain-core>=0.1.0,<1.0.0",
]
simulation = [
    "web3>=6.0.0,<8.0.0",
    "eth-abi>=4.0.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/lokii-D/lirix"
Repository = "https://github.com/lokii-D/lirix"
"Bug Tracker" = "https://github.com/lokii-D/lirix/issues"
Documentation = "https://github.com/lokii-D/lirix/blob/main/docs/api_reference.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
lirix = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lirix*"]
exclude = ["tests*", "examples*", "docs*", "benchmarks*", "tools*", ".github*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
extend-select = ["BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/benchmark/*.py" = ["E501", "E402", "SIM113", "SIM105", "E741"]
"lirix/_client_core/__init__.py" = ["E402", "I001"]


[[tool.mypy.overrides]]
module = ["tests.benchmark.*"]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --strict-markers --doctest-modules --import-mode=importlib tests --pyargs lirix"
norecursedirs = [".git", ".venv", "venv", "__pycache__", "node_modules", "tdsc", "mantle_TT", "checklists", "prompts", "cache"]
asyncio_mode = "auto"
markers = [
    "migration: migration-only compatibility coverage (legacy inputs retained during deprecation window)",
    "slow: long-running tests excluded from fast required lanes",
    "e2e: end-to-end integration coverage, optional in CI",
    "network: tests requiring live or simulated network dependencies",
    "perf: performance and baseline profiling suites",
]
filterwarnings = [
    "error",
    # 若有不可避免的第三方库弃用警告，在此用 "ignore:..." 逐条豁免；禁止全局放行。
]

[tool.coverage.run]
branch = true
source = ["lirix"]
# Entry shim: branch coverage for ``if __name__ == "__main__"`` is split across
# import vs ``-m`` execution contexts; omit from the denominator to keep fail-under
# meaningful for the library surface.
omit = ["**/lirix/__main__.py"]

[tool.coverage.report]
fail_under = 100
omit = ["tests/*"]

[tool.mypy]
# Align with `.python-version` / CI 3.12; mypy 1.10+ rejects python_version < 3.10.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
explicit_package_bases = true
disallow_any_generics = true
exclude = "(?x)(^\\.venv/|/site-packages/|(^|/)tests/)"

[[tool.mypy.overrides]]
module = ["langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["web3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["eth_abi.*"]
ignore_missing_imports = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py39, py310, py311, py312, py313, py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
extras = dev
setenv =
    PYTHONIOENCODING = utf-8
    PYTHONUTF8 = 1
commands =
    pytest {posargs}
"""
