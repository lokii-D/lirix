[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lirix"
version = "1.5.2"
description = "Security-focused DeFi payload validation SDK (zero private keys in-library; explicit dependencies)."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = {text = "MIT"}
authors = [{ name = "lokii", email = "zp715875634@gmail.com" }]
keywords = ["ethereum", "web3", "defi", "security", "multicall", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "web3>=6.0.0,<8.0.0",
]

[project.scripts]
lirix = "lirix.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "tox>=4.0.0",
    "build",
    "twine",
]
langchain = [
    "langchain>=0.1.0,<1.0.0",
    "langchain-core>=0.1.0,<1.0.0",
]
autogen = [
    "autogen-agentchat>=0.4.0,<1.0.0",
]
simulation = [
    "web3>=6.0.0,<8.0.0",
    "eth-abi>=4.0.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/lokii-D/lirix"
Repository = "https://github.com/lokii-D/lirix"
"Bug Tracker" = "https://github.com/lokii-D/lirix/issues"
Documentation = "https://pypi.org/project/lirix/"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["lirix*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --strict-markers --doctest-modules --import-mode=importlib tests --pyargs lirix"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["lirix"]

[tool.coverage.report]
fail_under = 100
omit = ["tests/*"]

[tool.mypy]
strict = true
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["langchain_core.*"]
ignore_missing_imports = true
